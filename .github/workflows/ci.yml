name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  core:
    name: core (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pytest && pip install -e core
      - run: python -m pytest -q
        working-directory: core

  daemon:
    name: daemon (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # pillow: image upload hardening (EXIF strip / downscale at the daemon).
      - run: pip install fastapi 'uvicorn[standard]' python-multipart fpdf2 segno httpx pillow pytest && pip install -e core -e daemon
      - run: python -m pytest -q
        working-directory: daemon

  vision:
    name: vision (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install httpx pillow pytest && pip install -e vision
      - run: python -m pytest -q
        working-directory: vision

  mcp:
    name: surfaces/mcp (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # mcp<2: the 2.x SDK removed mcp.server.fastmcp; the server targets 1.x.
      - run: pip install 'mcp>=1.8,<2' httpx pytest pytest-asyncio respx && pip install -e vision -e surfaces/mcp
      - run: python -m pytest -q
        working-directory: surfaces/mcp

  pwa-js:
    name: PWA JS tests (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test

  integration:
    name: smoke + sw precache + OpenAPI drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install fastapi 'uvicorn[standard]' python-multipart fpdf2 segno httpx pytest && pip install -e core -e daemon
      - run: python scripts/e2e_smoke.py
      - run: python scripts/check_sw_files.py
      - run: python scripts/export_openapi.py --check
