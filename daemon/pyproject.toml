[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "numislens-daemon"
version = "0.1.0"
description = "NumisLens FastAPI daemon"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "fpdf2>=2.7",
    "segno>=1.6",
    # Image upload hardening: decode-validation, EXIF strip, downscale-on-store.
    "pillow>=10.4",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
numislens-daemon = "numislens_daemon.__main__:main"

[tool.setuptools]
packages = ["numislens_daemon", "numislens_daemon.routers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
