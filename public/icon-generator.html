<!DOCTYPE html>
<html>
<head>
    <title>Icon Generator</title>
</head>
<body>
    <h1>Icon Generator</h1>
    <p>This page will help generate the required icons for the PWA.</p>
    
    <canvas id="canvas" style="display:none;"></canvas>
    
    <script>
        // Function to create a coin-like icon
        function createCoinIcon(size) {
            const canvas = document.getElementById('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            // Draw background circle
            ctx.fillStyle = '#f5f5f5';
            ctx.beginPath();
            ctx.arc(size/2, size/2, size/2, 0, 2 * Math.PI);
            ctx.fill();
            
            // Draw border
            ctx.strokeStyle = '#2196f3';
            ctx.lineWidth = size/10;
            ctx.beginPath();
            ctx.arc(size/2, size/2, size/2 - ctx.lineWidth/2, 0, 2 * Math.PI);
            ctx.stroke();
            
            // Draw inner circle
            ctx.fillStyle = '#2196f3';
            ctx.beginPath();
            ctx.arc(size/2, size/2, size/4, 0, 2 * Math.PI);
            ctx.fill();
            
            // Draw symbol (coin symbol)
            ctx.fillStyle = '#ffffff';
            ctx.font = `${size/3}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('$', size/2, size/2);
            
            return canvas.toDataURL('image/png');
        }
        
        // Generate all required icon sizes
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
        
        sizes.forEach(size => {
            const dataUrl = createCoinIcon(size);
            const link = document.createElement('a');
            link.href = dataUrl;
            link.download = `icon-${size}x${size}.png`;
            link.click();
        });
        
        document.body.innerHTML = '<h1>Icons generated! Check your downloads folder.</h1>';
    </script>
</body>
</html>
