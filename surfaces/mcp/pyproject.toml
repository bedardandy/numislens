[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "numislens-mcp"
version = "0.1.0"
description = "NumisLens MCP server (Model Context Protocol) over the REST daemon"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
dependencies = [
    # mcp<2: the 2.x SDK removed mcp.server.fastmcp, which this server imports.
    "mcp[cli]>=1.8,<2",
    "httpx>=0.27",
    # identify_coin runs the Phase-4 pipeline in-process. Install the local
    # package into this venv: pip install -e vision (see ops/README.md).
    "numislens-vision",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
]

[project.scripts]
numislens-mcp = "numislens_mcp.__main__:main"

[tool.setuptools]
packages = ["numislens_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
